<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Sipsy - Your $5 Welcome Gift</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .logo {
            font-size: 32px;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .code-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin: 30px 0;
        }

        .code-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .discount-code {
            font-family: 'Courier New', monospace;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 3px;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .code-expiry {
            font-size: 12px;
            opacity: 0.85;
        }

        .cta-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
            width: 100%;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        .copy-button {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 20px;
        }

        .copy-button:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f0f0f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .terms {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
            line-height: 1.6;
        }

        .terms a {
            color: #667eea;
            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎉</div>
            <h1>Welcome to Sipsy!</h1>
            <p class="subtitle">Thanks for joining us! Here's your exclusive welcome gift.</p>
        </div>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Getting your special welcome code...</p>
        </div>

        <div id="content" style="display: none;">
            <div id="errorMsg" class="error"></div>

            <div class="code-box">
                <div class="code-label">YOUR EXCLUSIVE CODE</div>
                <div class="discount-code" id="discountCode">-</div>
                <div class="code-expiry">Valid for 7 days</div>
            </div>

            <button class="copy-button" onclick="copyCode()">📋 Copy Code</button>
            <div id="copySuccess" class="success" style="display: none; margin-bottom: 15px;">✓ Code copied to clipboard!</div>

            <button class="cta-button" onclick="goToCheckout()">🛍️ Start Shopping</button>

            <div class="terms">
                <p>💡 Use this code at checkout to get <strong>$5 off</strong> your first order!</p>
                <p style="margin-top: 10px;">Questions? <a href="mailto:support@sipsy.com">Contact us</a></p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://sipsy-recovery-api-production.up.railway.app';
        let currentCode = null;

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');

            if (!email) {
                showError('Email not provided. Please sign up first!');
                return;
            }

            try {
                document.getElementById('loading').style.display = 'block';

                const response = await fetch(
                    `${API_BASE}/api/assign-code?email=${encodeURIComponent(email)}&type=signup`
                );

                if (!response.ok) {
                    throw new Error('Failed to get welcome code');
                }

                const data = await response.json();
                currentCode = data.code;

                document.getElementById('discountCode').textContent = data.code;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (error) {
                showError('Something went wrong. Please try again or contact support.');
                console.error(error);
            }
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
        }

        function copyCode() {
            if (currentCode) {
                navigator.clipboard.writeText(currentCode).then(() => {
                    const msg = document.getElementById('copySuccess');
                    msg.style.display = 'block';
                    setTimeout(() => {
                        msg.style.display = 'none';
                    }, 3000);
                });
            }
        }

        function goToCheckout() {
            if (currentCode) {
                window.location.href = `https://sipsy.com?discount=${currentCode}`;
            }
        }

        // Initialize on page load
        window.addEventListener('load', init);
    </script>
</body>
</html>

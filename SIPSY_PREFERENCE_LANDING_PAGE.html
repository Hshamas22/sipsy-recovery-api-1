<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Sipsy Preferences</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2d45 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 217, 255, 0.15);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #0a1628;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .header p {
            color: #00d9ff;
            font-size: 14px;
            font-weight: 600;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .checkbox-group:hover {
            background-color: #f9f9f9;
            border-color: #00d9ff;
        }
        .checkbox-group input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #00d9ff;
        }
        .checkbox-label {
            flex: 1;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }
        .emoji {
            margin-right: 8px;
            font-size: 16px;
        }
        .divider {
            height: 1px;
            background-color: #e0e0e0;
            margin: 25px 0;
        }
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-submit {
            background-color: #00d9ff;
            color: #0a1628;
        }
        .btn-submit:hover {
            background-color: #00b8d4;
            transform: translateY(-2px);
        }
        .btn-skip {
            background-color: #f0f0f0;
            color: #999;
        }
        .btn-skip:hover {
            background-color: #e0e0e0;
        }
        .success-message {
            display: none;
            text-align: center;
            padding: 40px;
            color: #0a1628;
        }
        .success-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        .success-message h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #00d9ff;
        }
        .error-message {
            display: none;
            background-color: #ffe0e0;
            color: #c80000;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 13px;
        }
        .loading {
            display: none;
            text-align: center;
        }
        .spinner {
            border: 3px solid #f0f0f0;
            border-top: 3px solid #00d9ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- FORM -->
        <form id="preferencesForm">
            <div class="header">
                <h1>Your Sipsy Preferences</h1>
                <p>Help us send you what you love ✨</p>
            </div>

            <div class="subtitle">
                Select all that interest you. We'll tailor your emails accordingly.
            </div>

            <div class="error-message" id="errorMessage"></div>

            <!-- PREFERENCES CHECKBOXES -->
            <div id="formContent">
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="new-products">
                        <span class="checkbox-label"><span class="emoji">🆕</span>New Products</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="sales">
                        <span class="checkbox-label"><span class="emoji">🏷️</span>Sales & Special Offers</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="tequila">
                        <span class="checkbox-label"><span class="emoji">🌵</span>Tequila</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="whiskey">
                        <span class="checkbox-label"><span class="emoji">🥃</span>Whiskey</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="wine">
                        <span class="checkbox-label"><span class="emoji">🍷</span>Wine</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="champagne">
                        <span class="checkbox-label"><span class="emoji">🍾</span>Champagne</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="sustainable">
                        <span class="checkbox-label"><span class="emoji">♻️</span>Sustainable Products</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="additive-free">
                        <span class="checkbox-label"><span class="emoji">🌿</span>Additive-Free Spirits</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="non-alcoholic">
                        <span class="checkbox-label"><span class="emoji">🥤</span>Non-Alcoholic Options</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" name="interests" value="cocktail-recipes">
                        <span class="checkbox-label"><span class="emoji">🍹</span>Cocktail Recipes</span>
                    </label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-submit">Save Preferences</button>
                    <button type="button" class="btn btn-skip" onclick="skipPreferences()">Skip for Now</button>
                </div>
            </div>

            <!-- LOADING STATE -->
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Saving your preferences...</p>
            </div>

            <!-- SUCCESS STATE -->
            <div class="success-message" id="successMessage">
                <div class="success-icon">✅</div>
                <h2>Perfect!</h2>
                <p>We've saved your preferences. You'll only get emails about what you love.</p>
                <p style="margin-top: 20px; font-size: 13px; color: #999;">Redirecting you to Sipsy...</p>
            </div>
        </form>
    </div>

    <script>
        // Get email from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');

        // Form submission
        document.getElementById('preferencesForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!email) {
                showError('Email not found. Please try again from the email link.');
                return;
            }

            // Get selected interests
            const selectedInterests = Array.from(document.querySelectorAll('input[name="interests"]:checked'))
                .map(cb => cb.value);

            if (selectedInterests.length === 0) {
                showError('Please select at least one interest.');
                return;
            }

            // Show loading
            document.getElementById('formContent').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            try {
                // Send to backend API
                const response = await fetch('https://sipsy-recovery-api-production.up.railway.app/api/update-preferences', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        interests: selectedInterests
                    })
                });

                if (!response.ok) {
                    throw new Error('Failed to save preferences');
                }

                // Show success
                document.getElementById('formContent').style.display = 'none';
                document.getElementById('loading').style.display = 'none';
                document.getElementById('successMessage').style.display = 'block';

                // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = 'https://sipsy.com';
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('formContent').style.display = 'block';
                showError('Something went wrong. Please try again.');
            }
        });

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        function skipPreferences() {
            window.location.href = 'https://sipsy.com';
        }

        // Check if email is present
        if (!email) {
            showError('Email not found. Please click the link in your email.');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your $5 Credit - Sipsy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        
        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        
        .subheading {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        
        .credit-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 48px;
            font-weight: 700;
            padding: 30px;
            border-radius: 12px;
            margin: 30px 0;
            display: inline-block;
        }
        
        .code-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 30px 0;
            border: 2px dashed #e0e0e0;
        }
        
        .code-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .code-display {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            letter-spacing: 2px;
            word-break: break-all;
        }
        
        .copy-button {
            background: #f0f0f0;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
        }
        
        .copy-button:hover {
            background: #e0e0e0;
        }
        
        .copy-button.copied {
            background: #4caf50;
            color: white;
        }
        
        .items-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: left;
        }
        
        .items-title {
            font-size: 14px;
            color: #666;
            font-weight: 600;
            margin-bottom: 15px;
        }
        
        .item {
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            color: #333;
        }
        
        .item:last-child {
            border-bottom: none;
        }
        
        .item-name {
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .item-price {
            color: #667eea;
            font-weight: 600;
        }
        
        .expires-warning {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #856404;
            margin: 20px 0;
            text-align: left;
        }
        
        .cta-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 20px;
        }
        
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .cta-button:active {
            transform: translateY(0);
        }
        
        .loading {
            display: none;
            font-size: 14px;
            color: #667eea;
            margin-top: 10px;
        }
        
        .error {
            background: #f8d7da;
            border-left: 4px solid #dc3545;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            display: none;
            font-size: 14px;
        }
        
        .success {
            background: #d4edda;
            border-left: 4px solid #28a745;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            display: none;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">SIPSY</div>
        
        <h1>You Have a $5 Credit!</h1>
        <p class="subheading">Apply it to your favorite items right now</p>
        
        <div class="credit-badge">$5 OFF</div>
        
        <div class="code-section">
            <div class="code-label">Your Unique Code</div>
            <div class="code-display" id="codeDisplay">LOADING...</div>
            <button class="copy-button" id="copyBtn" onclick="copyCode()">Copy Code</button>
        </div>
        
        <div class="items-section" id="itemsSection" style="display: none;">
            <div class="items-title">Your Items</div>
            <div id="itemsList"></div>
        </div>
        
        <div class="expires-warning">
            ⏱️ This code expires in <strong>48 hours</strong>. Don't miss out!
        </div>
        
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg"></div>
        
        <button class="cta-button" onclick="proceedToCheckout()">Apply & Go to Checkout</button>
        
        <div class="loading" id="loading">Processing...</div>
    </div>

    <script>
        // Get cart token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const cartToken = urlParams.get('cart_token');
        const cartId = urlParams.get('cart_id');
        
        // Store for tracking
        let assignedCode = null;
        let cartData = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            if (!cartToken && !cartId) {
                showError('Invalid recovery link. Please check your email.');
                return;
            }
            
            loadCart();
            generateCode();
        });
        
        function loadCart() {
            // Fetch cart data from Shopify
            const cartEndpoint = `/cart.js`;
            
            fetch(cartEndpoint)
                .then(res => res.json())
                .then(data => {
                    cartData = data;
                    displayItems(data);
                })
                .catch(err => {
                    console.log('Cart load note:', err);
                    // Don't show error - just proceed with code
                });
        }
        
        function displayItems(cart) {
            if (cart.items && cart.items.length > 0) {
                const itemsSection = document.getElementById('itemsSection');
                const itemsList = document.getElementById('itemsList');
                
                itemsList.innerHTML = cart.items.map(item => `
                    <div class="item">
                        <div class="item-name">${item.title}</div>
                        <div class="item-price">
                            ${(item.price / 100).toFixed(2)} × ${item.quantity} = $${(item.price * item.quantity / 100).toFixed(2)}
                        </div>
                    </div>
                `).join('');
                
                itemsSection.style.display = 'block';
            }
        }
        
        function generateCode() {
            // Generate unique code from batch
            // In production, this would call your API to assign a code
            const batch = ['SIPSY5-BB12AD', 'SIPSY5-007DA4', 'SIPSY5-96E7A9', 'SIPSY5-9B81CF', 'SIPSY5-FE4D8A', 'SIPSY5-A2D8F4', 'SIPSY5-C5E1B2', 'SIPSY5-D7F9E3'];
            
            // In real implementation, call API to get next available code
            // For now, use a random code from batch
            const code = batch[Math.floor(Math.random() * batch.length)];
            assignedCode = code;
            
            document.getElementById('codeDisplay').textContent = code;
        }
        
        function copyCode() {
            const codeText = document.getElementById('codeDisplay').textContent;
            navigator.clipboard.writeText(codeText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '✓ Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Code';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
        
        function proceedToCheckout() {
            if (!assignedCode) {
                showError('Code not ready yet. Please wait...');
                return;
            }
            
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            
            // Redirect to checkout with code applied
            // Shopify will apply the discount code if it's valid
            window.location.href = `/checkout?discount=${assignedCode}`;
        }
        
        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
        }
        
        function showSuccess(msg) {
            const successEl = document.getElementById('successMsg');
            successEl.textContent = msg;
            successEl.style.display = 'block';
        }
    </script>
</body>
</html>
